# member-service 配置
server:
  port: 8081

spring:
  application:
    name: member-service

  # 数据源：member-service 独享 gym_member 库（容器内由环境变量覆盖为 mysql-ms 服务名连接）
  datasource:
    url: jdbc:mysql://localhost:3306/gym_member?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  # Nacos 注册中心：地址与凭据通过环境变量注入（Compose 中 NACOS_SERVER_ADDR=nacos:8848）
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        # 个人项目独立分组，与课堂示例隔离
        group: ${NACOS_GROUP:GYM_YZ_GROUP}

# 健康检查端点（每个服务必须提供健康接口）
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# 第 09 周 JWT 配置：密钥经环境变量 JWT_SECRET 注入（与 gateway-service 共享，HS256 至少 32 字节）
# 本地默认值仅供开发/测试，容器内一律使用 .env 中的真实值
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-please-override-32bytes}
    ttl-minutes: ${JWT_TTL_MINUTES:120}
