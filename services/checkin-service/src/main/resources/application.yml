# checkin-service 配置
server:
  port: 8083

spring:
  application:
    name: checkin-service

  # 数据源：checkin-service 独享 gym_checkin 库（容器内由环境变量覆盖为 mysql-ms 服务名连接）
  datasource:
    url: jdbc:mysql://localhost:3306/gym_checkin?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  # Nacos 注册中心：地址与凭据通过环境变量注入（Compose 中 NACOS_SERVER_ADDR=nacos:8848）
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        # 个人项目独立分组，与课堂示例隔离
        group: ${NACOS_GROUP:GYM_YZ_GROUP}
    # OpenFeign（第 08 周）：按服务名调用 card-service，多实例由 LoadBalancer 轮询；
    # 保留连接 2s / 读取 3s 超时（重试策略见 FeignErrorConfig：不自动重试）
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000

# 健康检查端点
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
