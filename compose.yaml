services:
  # ========== 单体版本（保留，第 05 周内容，不参与微服务调用链） ==========
  # MySQL 8.4.11 数据库服务（单体版 gym 库）
  mysql:
    image: mysql:8.4.11
    container_name: gym-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Shanghai
    ports:
      # 宿主机 3306 已被本地 MySQL 占用，容器映射到 3307
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      # 命名数据卷：容器删除重建后数据仍在
      - mysql-data:/var/lib/mysql
    networks:
      - gym-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  # Spring Boot 单体应用（保留版本）
  app:
    build:
      context: ./monolith
    image: gym-monolith:week05
    container_name: gym-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - gym-net
    restart: unless-stopped

  # ========== 微服务专用 MySQL 实例（独立于单体的 gym 库） ==========
  # 首次启动时执行 docker/mysql-init.sql：创建 3 个独立数据库 + 3 个隔离账号
  mysql-ms:
    image: mysql:8.4.11
    container_name: gym-mysql-ms
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_MS_HOST_PORT:-3308}:3306"
    volumes:
      - mysql-ms-data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - gym-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  # ========== 微服务：member-service（会员档案） ==========
  member-service:
    build:
      context: ./services/member-service
    image: gym-member-service:week06
    container_name: gym-member-service
    depends_on:
      mysql-ms:
        condition: service_healthy
    environment:
      # 通过 Compose 服务名 mysql-ms 连接独立数据库，不使用 localhost
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-ms:3306/gym_member?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: member_u
      SPRING_DATASOURCE_PASSWORD: member_pass
      TZ: Asia/Shanghai
    ports:
      - "8081:8081"
    networks:
      - gym-net
    restart: unless-stopped

  # ========== 微服务：card-service（会员卡） ==========
  card-service:
    build:
      context: ./services/card-service
    image: gym-card-service:week06
    container_name: gym-card-service
    depends_on:
      mysql-ms:
        condition: service_healthy
      member-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-ms:3306/gym_card?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: card_u
      SPRING_DATASOURCE_PASSWORD: card_pass
      # 跨服务调用：通过服务名 member-service 通信（覆盖 application.yml 中的 localhost 默认值）
      MEMBER_SERVICE_BASE_URL: http://member-service:8081
      TZ: Asia/Shanghai
    ports:
      - "8082:8082"
    networks:
      - gym-net
    restart: unless-stopped

  # ========== 微服务：checkin-service（入场核验） ==========
  checkin-service:
    build:
      context: ./services/checkin-service
    image: gym-checkin-service:week06
    container_name: gym-checkin-service
    depends_on:
      mysql-ms:
        condition: service_healthy
      card-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-ms:3306/gym_checkin?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: checkin_u
      SPRING_DATASOURCE_PASSWORD: checkin_pass
      # 跨服务调用：通过服务名 card-service 通信（覆盖 application.yml 中的 localhost 默认值）
      CARD_SERVICE_BASE_URL: http://card-service:8082
      TZ: Asia/Shanghai
    ports:
      - "8083:8083"
    networks:
      - gym-net
    restart: unless-stopped

volumes:
  # 单体版数据卷（保留）
  mysql-data:
    name: gym-mysql-data
  # 微服务专用数据卷
  mysql-ms-data:
    name: gym-ms-mysql-data

networks:
  gym-net:
    name: gym-net
