services:
  # MySQL 8.4.11 数据库服务
  mysql:
    image: mysql:8.4.11
    container_name: gym-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Shanghai
    ports:
      # 宿主机 3306 已被本地 MySQL 占用，容器映射到 3307
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      # 命名数据卷：容器删除重建后数据仍在
      - mysql-data:/var/lib/mysql
    networks:
      - gym-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  # Spring Boot 单体应用
  app:
    build:
      context: ./monolith
    image: gym-monolith:week05
    container_name: gym-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 通过数据库服务名 mysql 连接（Compose 内部网络 DNS）
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - gym-net
    restart: unless-stopped

volumes:
  mysql-data:
    name: gym-mysql-data

networks:
  gym-net:
    name: gym-net
